<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mesa · Cardápio & Planejamento</title>
  <style>
    /* ==========================================
       APPLE HUMAN INTERFACE GUIDELINES INSPIRATION
       Clean, airy, neutral greys, subtle glassmorphism, refined typography
       ========================================== */
    :root {
      --system-bg: #f5f5f7;
      --card-bg: rgba(255, 255, 255, 0.88);
      --card-solid: #ffffff;
      --text-primary: #1d1d1f;
      --text-secondary: #6e6e73;
      --text-tertiary: #86868b;
      --accent: #0071e3;
      --accent-hover: #0077ed;
      --border-subtle: rgba(0, 0, 0, 0.08);
      --border-hover: rgba(0, 0, 0, 0.16);
      --surface-subtle: #fbfbfd;
      --surface-active: #f0f0f2;
      
      --pill-bg: #f5f5f7;
      --pill-text: #1d1d1f;
      --chef-bg: #f5f0fb;
      --chef-text: #5b21b6;
      --prereq-bg: #fffbf0;
      --prereq-border: #fbe3aa;
      --prereq-text: #78350f;
      --tip-bg: #f0fdf4;
      --tip-border: #bbf7d0;
      --tip-text: #166534;
      --cal-bg: #fff7ed;
      --cal-text: #c2410c;
      --cal-border: #fed7aa;

      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-full: 9999px;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      background: var(--system-bg);
      color: var(--text-primary);
      line-height: 1.47059;
      letter-spacing: -0.022em;
      padding: 32px 16px 80px;
      max-width: 860px;
      margin: 0 auto;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 32px;
    }
    .brand-eyebrow {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin-bottom: 6px;
    }
    header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.035em;
      color: var(--text-primary);
      margin-bottom: 6px;
    }
    header p {
      color: var(--text-secondary);
      font-size: 1.02rem;
      font-weight: 400;
      max-width: 520px;
      margin: 0 auto;
    }

    /* Segmented Control (Tabs) */
    .tabs-nav {
      display: flex;
      gap: 4px;
      background: #e5e5ea;
      padding: 4px;
      border-radius: var(--radius-md);
      margin-bottom: 32px;
      max-width: 440px;
      margin-left: auto;
      margin-right: auto;
    }
    .tab-btn {
      flex: 1;
      padding: 8px 16px;
      border: none;
      background: transparent;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      border-radius: 10px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      text-align: center;
      font-family: inherit;
    }
    .tab-btn.active {
      background: #ffffff;
      color: var(--text-primary);
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Badge/Summary Exclusivo da Aba Consulta */
    .consulta-stats-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .stat-card {
      flex: 1;
      min-width: 160px;
      background: var(--card-solid);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      box-shadow: var(--shadow-sm);
    }
    .stat-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }
    .stat-value {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.03em;
    }

    /* Painel de Filtros na Aba Consulta */
    .filter-panel {
      background: var(--card-solid);
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      margin-bottom: 28px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-subtle);
    }
    .filter-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }
    @media (max-width: 680px) {
      .filter-grid { grid-template-columns: 1fr; }
    }

    .form-group label {
      display: block;
      font-weight: 600;
      font-size: 0.8rem;
      letter-spacing: -0.01em;
      margin-bottom: 8px;
      color: var(--text-secondary);
      text-transform: uppercase;
    }

    select {
      width: 100%;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background: #ffffff;
      font-size: 0.92rem;
      outline: none;
      color: var(--text-primary);
      font-family: inherit;
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20width%3D%2220%22%20height%3D%2220%22%20viewBox%3D%220%200%2020%2020%22%20fill%3D%22none%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%3Cpath%20d%3D%22M5%207.5L10%2012.5L15%207.5%22%20stroke%3D%22%2386868B%22%20stroke-width%3D%221.8%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E");
      background-repeat: no-repeat;
      background-position: right 12px center;
      background-size: 16px;
      transition: all 0.2s ease;
    }
    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15);
    }

    .btn-reset {
      width: 100%;
      padding: 9px;
      background: transparent;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      font-size: 0.84rem;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .btn-reset:hover {
      background: #fbfbfd;
      color: var(--text-primary);
      border-color: var(--border-hover);
    }

    /* Section Headings */
    .section-title {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      margin: 28px 0 16px;
    }

    .recipes-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 32px;
    }
    .recipe-card {
      background: var(--card-solid);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-subtle);
      padding: 22px;
      box-shadow: var(--shadow-sm);
      transition: box-shadow 0.2s ease, transform 0.2s ease;
    }
    .recipe-card:hover {
      box-shadow: var(--shadow-md);
    }
    .recipe-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 12px;
    }
    .recipe-title {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }
    .recipe-meta-badges {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .time-badge {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-tertiary);
      white-space: nowrap;
    }
    .cal-badge {
      font-size: 0.76rem;
      font-weight: 600;
      background: var(--cal-bg);
      color: var(--cal-text);
      border: 1px solid var(--cal-border);
      padding: 2px 8px;
      border-radius: var(--radius-full);
      white-space: nowrap;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }
    .tag {
      font-size: 0.78rem;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      background: var(--pill-bg);
      color: var(--pill-text);
      border: 1px solid var(--border-subtle);
    }

    /* Accordion Details & Preparo Vertical List */
    details {
      background: var(--surface-subtle);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      border: 1px solid var(--border-subtle);
      transition: background 0.2s ease;
    }
    summary {
      font-weight: 500;
      font-size: 0.88rem;
      cursor: pointer;
      color: var(--accent);
      outline: none;
      user-select: none;
    }
    .recipe-content {
      margin-top: 10px;
      border-top: 1px solid var(--border-subtle);
      padding-top: 10px;
    }
    .preparo-vertical-list {
      list-style-type: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .preparo-vertical-list li {
      font-size: 0.92rem;
      color: #333336;
      line-height: 1.55;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .preparo-step-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #e5e5ea;
      color: var(--text-primary);
      font-size: 0.75rem;
      font-weight: 600;
      margin-top: 2px;
      flex-shrink: 0;
    }

    /* Dica box (sem número) */
    .preparo-dica-container {
      margin-top: 6px;
      padding: 10px 14px;
      background: var(--tip-bg);
      border: 1px solid var(--tip-border);
      border-radius: var(--radius-md);
      width: 100%;
    }
    .preparo-dica-title {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--tip-text);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .preparo-dica-content {
      font-size: 0.88rem;
      color: #14532d;
      line-height: 1.5;
    }

    /* Highlighted Prerequisites Box */
    .prereqs-box {
      margin-top: 14px;
      background: var(--prereq-bg);
      border: 1px solid var(--prereq-border);
      border-radius: var(--radius-md);
      padding: 12px 16px;
    }
    .prereqs-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .prereqs-title {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--prereq-text);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .prereqs-portion-pill {
      font-size: 0.75rem;
      font-weight: 600;
      background: #fbe3aa;
      color: #78350f;
      padding: 2px 8px;
      border-radius: var(--radius-full);
    }
    .prereqs-list {
      list-style-type: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .prereqs-list li {
      font-size: 0.88rem;
      color: var(--prereq-text);
      display: flex;
      align-items: flex-start;
      gap: 8px;
      line-height: 1.45;
    }
    .prereqs-list li::before {
      content: "—";
      color: #b45309;
      font-weight: 600;
    }

    .empty-state {
      padding: 32px;
      text-align: center;
      color: var(--text-tertiary);
      font-size: 0.95rem;
      background: var(--card-solid);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-subtle);
    }

    /* ==========================================
       TAB: WEEKLY PLANNER
       ========================================== */
    .planner-header-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .action-buttons-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 18px;
      border: none;
      border-radius: var(--radius-full);
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-print-menu {
      background: var(--text-primary);
      color: #ffffff;
    }
    .btn-print-menu:hover {
      background: #000000;
      transform: scale(1.02);
    }
    
    .btn-shopping-list {
      background: #e8e8ed;
      color: var(--text-primary);
    }
    .btn-shopping-list:hover {
      background: #d8d8dd;
      transform: scale(1.02);
    }

    .day-planner-card {
      background: var(--card-solid);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-subtle);
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
    }
    .day-header {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .day-title-text {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .day-header-badges {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .resp-badge-header {
      font-size: 0.78rem;
      font-weight: 600;
      background: var(--chef-bg);
      color: var(--chef-text);
      padding: 4px 12px;
      border-radius: var(--radius-full);
      display: none;
      letter-spacing: -0.01em;
    }
    .day-cal-total-badge {
      font-size: 0.78rem;
      font-weight: 700;
      background: var(--cal-bg);
      color: var(--cal-text);
      border: 1px solid var(--cal-border);
      padding: 4px 12px;
      border-radius: var(--radius-full);
      display: none;
      letter-spacing: -0.01em;
    }
    
    .planner-selectors {
      display: grid;
      grid-template-columns: 1.3fr 1.3fr 1fr 0.9fr;
      gap: 14px;
      margin-bottom: 18px;
    }
    @media (max-width: 760px) {
      .planner-selectors { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 480px) {
      .planner-selectors { grid-template-columns: 1fr; }
    }

    .day-summary-container { margin-top: 14px; }
    .day-recipe-block {
      background: var(--surface-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-top: 12px;
    }
    .day-recipe-block h4 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .badge-salad {
      font-size: 0.72rem;
      font-weight: 600;
      background: #eef7ee;
      color: #166534;
      padding: 3px 8px;
      border-radius: var(--radius-sm);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .badge-main {
      font-size: 0.72rem;
      font-weight: 600;
      background: #eff6ff;
      color: var(--accent);
      padding: 3px 8px;
      border-radius: var(--radius-sm);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    #printShoppingContainer { display: none; }

    /* ==========================================
       PRINT STYLES (Clean PDF / Paper Output)
       ========================================== */
    @media print {
      @page {
        size: A4 portrait;
        margin: 14mm 12mm;
      }
      body {
        background: #ffffff !important;
        color: #000000 !important;
        padding: 0 !important;
        max-width: 100% !important;
        font-size: 9.5pt;
      }
      header, .tabs-nav, #abaConsulta, .planner-selectors, .planner-header-actions, select {
        display: none !important;
      }

      /* Weekly Menu Print */
      body.printing-menu #abaPlanejamento {
        display: block !important;
      }
      body.printing-menu #printShoppingContainer {
        display: none !important;
      }
      body.printing-menu .day-planner-card {
        page-break-inside: avoid;
        border: 1px solid #d1d1d6 !important;
        box-shadow: none !important;
        margin-bottom: 14px !important;
        padding: 14px !important;
        background: #ffffff !important;
        border-radius: 10px !important;
      }
      body.printing-menu .day-header {
        font-size: 12pt !important;
        border-bottom: 1.5px solid #1d1d1f !important;
        margin-bottom: 10px !important;
        padding-bottom: 4px !important;
      }
      body.printing-menu .resp-badge-header {
        display: inline-block !important;
        border: 1px solid #9333ea !important;
        color: #6b21a8 !important;
        font-size: 8pt !important;
        padding: 2px 8px !important;
      }
      body.printing-menu .day-cal-total-badge {
        display: inline-block !important;
        border: 1px solid #ea580c !important;
        color: #c2410c !important;
        font-size: 8pt !important;
        padding: 2px 8px !important;
      }
      body.printing-menu .day-recipe-block {
        border: 1px solid #e5e5ea !important;
        background: #fafafa !important;
        padding: 10px !important;
        margin-top: 8px !important;
        border-radius: 8px !important;
      }
      body.printing-menu details {
        background: transparent !important;
        padding: 0 !important;
        border: none !important;
      }
      body.printing-menu details summary {
        display: none !important;
      }
      body.printing-menu details .recipe-content {
        display: block !important;
        border-top: none !important;
        padding-top: 4px !important;
      }
      body.printing-menu .preparo-vertical-list li {
        font-size: 9pt !important;
        color: #1d1d1f !important;
      }
      body.printing-menu .preparo-step-number {
        background: #e5e5ea !important;
        color: #000000 !important;
      }
      body.printing-menu .preparo-dica-container {
        background: #f0fdf4 !important;
        border: 1px solid #bbf7d0 !important;
        padding: 6px 10px !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      body.printing-menu .prereqs-box {
        background: #fffbeb !important;
        border: 1px solid #fde68a !important;
        padding: 8px 10px !important;
        margin-top: 8px !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      body.printing-menu .prereqs-title {
        font-size: 8pt !important;
      }
      body.printing-menu .prereqs-portion-pill {
        border: 1px solid #d97706 !important;
        font-size: 7.5pt !important;
        padding: 1px 6px !important;
      }
      body.printing-menu .prereqs-list li {
        font-size: 8.5pt !important;
        color: #78350f !important;
      }

      /* Shopping List Print */
      body.printing-shopping #abaPlanejamento {
        display: none !important;
      }
      body.printing-shopping #printShoppingContainer {
        display: block !important;
      }
      .shopping-print-title {
        font-size: 16pt !important;
        font-weight: 700 !important;
        color: #1d1d1f !important;
        border-bottom: 2px solid #1d1d1f !important;
        padding-bottom: 6px !important;
        margin-bottom: 12px !important;
        letter-spacing: -0.02em;
      }
      .shopping-category-block {
        margin-bottom: 18px !important;
        page-break-inside: avoid;
      }
      .shopping-cat-title {
        font-size: 11pt !important;
        font-weight: 600 !important;
        padding: 4px 0 !important;
        margin-bottom: 8px !important;
        border-bottom: 1px solid #d1d1d6;
        color: #1d1d1f !important;
      }
      .shopping-table {
        width: 100% !important;
        border-collapse: collapse !important;
        margin-bottom: 8px !important;
      }
      .shopping-table th, .shopping-table td {
        border-bottom: 1px solid #e5e5ea !important;
        padding: 7px 8px !important;
        font-size: 9pt !important;
      }
      .shopping-table th {
        color: #6e6e73 !important;
        font-weight: 600 !important;
        text-align: left !important;
        text-transform: uppercase;
        font-size: 7.5pt !important;
        letter-spacing: 0.05em;
      }
      .shopping-check-box {
        width: 13px;
        height: 13px;
        border: 1px solid #86868b;
        border-radius: 3px;
        display: inline-block;
        margin-right: 8px;
        vertical-align: middle;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-eyebrow">Planejamento & Gastronomia</div>
    <h1>Gasparini's Kitchen</h1>
    <p>Uma solução artificial para um problema natural</p>
  </header>

  <!-- Segmented Control Tabs (Semana primeiro e ativa) -->
  <nav class="tabs-nav">
    <button id="btnTabSemana" class="tab-btn active" onclick="trocarAba('abaPlanejamento')">Semana</button>
    <button id="btnTabConsulta" class="tab-btn" onclick="trocarAba('abaConsulta')">Consultar</button>
  </nav>

  <!-- ==========================================
       TAB 1: WEEKLY PLANNER (Ativa por padrão)
       ========================================== -->
  <section id="abaPlanejamento" class="tab-content active">
    <div class="planner-header-actions">
      <div>
        <h2 style="font-size: 1.35rem; font-weight: 700; color: var(--text-primary);">Jantares da Semana</h2>
        <p style="color: var(--text-secondary); font-size: 0.9rem;">Escolha prato, salada, chef e quantidade de pessoas (1 a 6).</p>
      </div>
      <div class="action-buttons-group">
        <button class="btn-action btn-shopping-list" onclick="gerarListaComprasPDF()">
          Lista de Compras
        </button>
        <button class="btn-action btn-print-menu" onclick="executarImpressaoCardapio()">
          Imprimir Cardápio
        </button>
      </div>
    </div>

    <div id="containerDiasSemana"></div>
  </section>

  <!-- ==========================================
       TAB 2: CONSULTATION (Com Filtros e Métricas)
       ========================================== -->
  <section id="abaConsulta" class="tab-content">
    <div class="consulta-stats-bar">
      <div class="stat-card">
        <div class="stat-label">Pratos Principais</div>
        <div class="stat-value" id="statPratosCount">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Saladas & Acomp.</div>
        <div class="stat-value" id="statSaladasCount">0</div>
      </div>
    </div>

    <!-- Painel de Filtros Integrado na Consulta -->
    <div class="filter-panel">
      <div class="filter-grid">
        <div class="form-group">
          <label for="filtroProteina">Proteína</label>
          <select id="filtroProteina" onchange="aplicarFiltrosConsulta()">
            <option value="">Todas as opções</option>
          </select>
        </div>

        <div class="form-group">
          <label for="filtroCarboidrato">Carboidrato</label>
          <select id="filtroCarboidrato" onchange="aplicarFiltrosConsulta()">
            <option value="">Todas as opções</option>
          </select>
        </div>

        <div class="form-group">
          <label for="filtroLegume">Legume / Vegetal</label>
          <select id="filtroLegume" onchange="aplicarFiltrosConsulta()">
            <option value="">Todos os legumes</option>
          </select>
        </div>
      </div>
      <button class="btn-reset" onclick="limparFiltrosConsulta()">Limpar Filtros de Consulta</button>
    </div>

    <h2 class="section-title">Pratos Principais</h2>
    <main class="recipes-list" id="listaPrincipais"></main>

    <h2 class="section-title">Saladas & Acompanhamentos</h2>
    <main class="recipes-list" id="listaSaladas"></main>
  </section>

  <div id="printShoppingContainer"></div>

  <script>
    // ==========================================
    // DATA & STATE
    // ==========================================
    const responsaveis = ["Ulises", "Paula", "Maitê"];
    const diasUteis = [
      { key: "seg", nome: "Segunda-feira" },
      { key: "ter", nome: "Terça-feira" },
      { key: "qua", nome: "Quarta-feira" },
      { key: "qui", nome: "Quinta-feira" },
      { key: "sex", nome: "Sexta-feira" }
    ];

    let pratosPrincipais = [];
    let saladas = [];
    let mapaBaseIngredientes = []; // Estrutura: { base: "Frango", ingrediente: "Peito de Frango", valor: 150, unidade: "g" }

    // ==========================================
    // HELPER: FORMATADOR VERTICAL DE MODO DE PREPARO
    // ==========================================
    function formatarModoPreparoVertical(textoPreparo) {
      if (!textoPreparo) return "<p style='color:var(--text-tertiary); font-size:0.9rem;'>Sem modo de preparo cadastrado.</p>";
      
      let partes = textoPreparo
        .split(/(?:\r?\n|\.(?!\d)|;)+/)
        .map(p => p.trim())
        .filter(p => p.length > 0);

      let stepCounter = 1;
      let itensHtml = "";

      partes.forEach(parte => {
        const matchDica = parte.match(/^dica[:\s\-—]*(.*)$/i);
        
        if (matchDica) {
          const conteudoDica = matchDica[1].trim();
          itensHtml += `
            <li style="display:block; width:100%;">
              <div class="preparo-dica-container">
                <div class="preparo-dica-title">Dica</div>
                <div class="preparo-dica-content">${conteudoDica ? (conteudoDica + (conteudoDica.endsWith('.') ? '' : '.')) : ''}</div>
              </div>
            </li>
          `;
        } else {
          itensHtml += `
            <li>
              <span class="preparo-step-number">${stepCounter++}</span>
              <div>${parte}${parte.endsWith('.') ? '' : '.'}</div>
            </li>
          `;
        }
      });

      return `<ul class="preparo-vertical-list">${itensHtml}</ul>`;
    }

    // ==========================================
    // HELPER: AJUSTADOR DINÂMICO DE QUANTIDADES NOS REQUISITOS
    // ==========================================
    function ajustarTextoRequisito(texto, pessoas) {
      if (!pessoas || pessoas === 1) return texto;

      return texto.replace(/(\b\d+(?:[.,]\d+)?\s*)(g|kg|ml|l|xícara|xícaras|colher|colheres|dente|dentes|unidade|unidades|fatia|fatias|filé|filés|posta|postas|folha|folhas)?\b/gi, (match, numStr, unit) => {
        const numOriginal = parseFloat(numStr.replace(',', '.'));
        if (isNaN(numOriginal)) return match;
        
        const numCalculado = numOriginal * pessoas;
        const numFormatado = Number.isInteger(numCalculado) ? numCalculado : numCalculado.toFixed(1).replace('.', ',');
        return `${numFormatado}${unit ? ' ' + unit : ''}`;
      });
    }

    // ==========================================
    // CSV PARSER ROBUSTO
    // ==========================================
    function parseCSV(text) {
      const linhas = [];
      let linhaAtual = [];
      let campoAtual = "";
      let dentroDeAspas = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const proxChar = text[i + 1];

        if (char === '"') {
          if (dentroDeAspas && proxChar === '"') {
            campoAtual += '"';
            i++;
          } else {
            dentroDeAspas = !dentroDeAspas;
          }
        } else if (char === ',' && !dentroDeAspas) {
          linhaAtual.push(campoAtual.trim());
          campoAtual = "";
        } else if ((char === '\r' || char === '\n') && !dentroDeAspas) {
          if (char === '\r' && proxChar === '\n') i++;
          linhaAtual.push(campoAtual.trim());
          if (linhaAtual.some(c => c.length > 0)) {
            linhas.push(linhaAtual);
          }
          linhaAtual = [];
          campoAtual = "";
        } else {
          campoAtual += char;
        }
      }
      if (campoAtual || linhaAtual.length > 0) {
        linhaAtual.push(campoAtual.trim());
        if (linhaAtual.some(c => c.length > 0)) {
          linhas.push(linhaAtual);
        }
      }
      return linhas;
    }

    function processarCSVGenerico(linhas, isSalada = false) {
      if (linhas.length < 2) return [];

      const headers = linhas[0].map(h => h.trim().toLowerCase());
      
      const idxNome = headers.findIndex(h => 
        isSalada ? (h.includes("nome da salada") || h.includes("salada") || h.includes("nome"))
                 : (h.includes("nome do prato") || h.includes("prato") || h.includes("nome"))
      );
      const idxTempo = headers.findIndex(h => h.includes("tempo") || h.includes("dura"));
      const idxReceita = headers.findIndex(h => (h.includes("receita") || h.includes("modo") || h.includes("preparo") || h.includes("instru")) && !h.includes("tempo"));
      const idxLegumes = headers.findIndex(h => h.includes("legume") || h.includes("vegeta"));
      const idxProteinas = headers.findIndex(h => h.includes("prote"));
      const idxCarboidratos = headers.findIndex(h => h.includes("carbo"));
      const idxRequisitos = headers.findIndex(h => h.includes("requisito"));
      const idxCalorias = headers.findIndex(h => h.includes("caloria") || h.includes("kcal") || h.includes("cal"));

      const lista = [];

      for (let i = 1; i < linhas.length; i++) {
        const row = linhas[i];
        if (row.length === 0 || !row[idxNome]) continue;

        const nome = row[idxNome] || "Sem Nome";
        const tempo = idxTempo >= 0 ? (row[idxTempo] || "20 min") : "20 min";
        const preparo = idxReceita >= 0 ? (row[idxReceita] || "") : "";
        const proteina = idxProteinas >= 0 ? (row[idxProteinas] || "N/A") : "N/A";
        const carboidrato = idxCarboidratos >= 0 ? (row[idxCarboidratos] || "N/A") : "N/A";
        
        let calorias = 0;
        if (idxCalorias >= 0 && row[idxCalorias]) {
          const parsedCal = parseInt(row[idxCalorias].toString().replace(/\D/g, ''), 10);
          if (!isNaN(parsedCal)) calorias = parsedCal;
        }

        let legumes = [];
        if (idxLegumes >= 0 && row[idxLegumes]) {
          legumes = row[idxLegumes].split(/[,;]/).map(l => l.trim()).filter(l => l.length > 0);
        }

        let prerequisitos = [];
        if (idxRequisitos >= 0 && row[idxRequisitos]) {
          prerequisitos = row[idxRequisitos].split(/[;\n]/).map(r => r.trim()).filter(r => r.length > 0);
        }

        lista.push({
          id: `${isSalada ? 'salada' : 'prato'}_${i}`,
          nome: nome,
          tempo: tempo,
          preparo: preparo,
          proteina: proteina,
          carboidrato: carboidrato,
          legumes: legumes,
          prerequisitos: prerequisitos,
          calorias: calorias
        });
      }

      return lista;
    }

    function processarCSVBaseIngredientes(linhas) {
      if (linhas.length < 2) return [];

      const headers = linhas[0].map(h => h.trim().toLowerCase());
      const idxBase = headers.findIndex(h => h.includes("base"));
      const idxIngrediente = headers.findIndex(h => h.includes("ingrediente"));
      const idxUnidades = headers.findIndex(h => h.includes("unidade") || h.includes("qtd") || h.includes("quantidade"));

      const lista = [];

      for (let i = 1; i < linhas.length; i++) {
        const row = linhas[i];
        if (row.length === 0 || !row[idxBase] || !row[idxIngrediente]) continue;

        const base = row[idxBase].trim();
        const ingrediente = row[idxIngrediente].trim();
        const unidadesStr = idxUnidades >= 0 ? (row[idxUnidades] || "1 un").trim() : "1 un";

        // Extrai valor numérico e unidade textual (ex: "150g" -> valor: 150, unidade: "g")
        const match = unidadesStr.match(/^([\d.,]+)\s*(.*)$/);
        let valor = 1;
        let unidade = unidadesStr;

        if (match) {
          valor = parseFloat(match[1].replace(',', '.')) || 1;
          unidade = match[2].trim() || "";
        }

        lista.push({
          base: base.toLowerCase(),
          baseOriginal: base,
          ingrediente: ingrediente,
          valor: valor,
          unidade: unidade
        });
      }

      return lista;
    }

    async function carregarTodosCSVs() {
      // 1. Carrega pratos.csv
      try {
        const resP = await fetch("pratos.csv", { cache: "no-cache" });
        if (resP.ok) {
          const textP = await resP.text();
          pratosPrincipais = processarCSVGenerico(parseCSV(textP), false);
        }
      } catch (e) {}

      // 2. Carrega saladas.csv
      try {
        const resS = await fetch("saladas.csv", { cache: "no-cache" });
        if (resS.ok) {
          const textS = await resS.text();
          saladas = processarCSVGenerico(parseCSV(textS), true);
        }
      } catch (e) {}

      // 3. Carrega de_base_para_ingredientes.csv
      try {
        const resB = await fetch("de_base_para_ingredientes.csv", { cache: "no-cache" });
        if (resB.ok) {
          const textB = await resB.text();
          mapaBaseIngredientes = processarCSVBaseIngredientes(parseCSV(textB));
        }
      } catch (e) {}

      atualizarInterface();
    }

    function popularSelectsFiltro() {
      const todos = [...pratosPrincipais, ...saladas];
      const selP = document.getElementById("filtroProteina");
      const selC = document.getElementById("filtroCarboidrato");
      const selL = document.getElementById("filtroLegume");

      selP.innerHTML = '<option value="">Todas as proteínas</option>';
      selC.innerHTML = '<option value="">Todos os carboidratos</option>';
      selL.innerHTML = '<option value="">Todos os legumes</option>';

      const proteinas = [...new Set(todos.map(r => r.proteina).filter(p => p && p !== "N/A"))].sort();
      const carboidratos = [...new Set(todos.map(r => r.carboidrato).filter(c => c && c !== "N/A"))].sort();
      
      const legumesSet = new Set();
      todos.forEach(r => {
        if (Array.isArray(r.legumes)) {
          r.legumes.forEach(l => { if (l) legumesSet.add(l); });
        }
      });
      const legumes = [...legumesSet].sort();

      proteinas.forEach(p => selP.innerHTML += `<option value="${p}">${p}</option>`);
      carboidratos.forEach(c => selC.innerHTML += `<option value="${c}">${c}</option>`);
      legumes.forEach(l => selL.innerHTML += `<option value="${l}">${l}</option>`);
    }

    function atualizarInterface() {
      document.getElementById("statPratosCount").textContent = pratosPrincipais.length;
      document.getElementById("statSaladasCount").textContent = saladas.length;

      popularSelectsFiltro();
      aplicarFiltrosConsulta();
      montarPlanejadorSemanal();
    }

    // ==========================================
    // NAVIGATION
    // ==========================================
    function trocarAba(abaId) {
      document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
      document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));
      
      const targetSection = document.getElementById(abaId);
      if (targetSection) targetSection.classList.add("active");
      
      if (abaId === 'abaPlanejamento') {
        document.getElementById('btnTabSemana').classList.add("active");
      } else {
        document.getElementById('btnTabConsulta').classList.add("active");
      }
    }

    // ==========================================
    // RENDER & FILTROS NA CONSULTA
    // ==========================================
    const containerPrincipais = document.getElementById("listaPrincipais");
    const containerSaladas = document.getElementById("listaSaladas");

    function gerarCardHtml(r) {
      const tagsLegumes = (r.legumes || []).map(leg => `<span class="tag">${leg}</span>`).join(" ");
      const badgeCaloria = r.calorias > 0 ? `<span class="cal-badge">${r.calorias} kcal</span>` : '';

      let prereqsHtml = "";
      if (r.prerequisitos && r.prerequisitos.length > 0) {
        const itens = r.prerequisitos.map(item => `<li>${item}</li>`).join("");
        prereqsHtml = `
          <div class="prereqs-box">
            <div class="prereqs-title">Organização Prévia & Requisitos (Base: 1 porção)</div>
            <ul class="prereqs-list">${itens}</ul>
          </div>
        `;
      }

      return `
        <div class="recipe-card">
          <div class="recipe-header">
            <span class="recipe-title">${r.nome}</span>
            <div class="recipe-meta-badges">
              ${badgeCaloria}
              <span class="time-badge">${r.tempo}</span>
            </div>
          </div>
          <div class="tags">
            <span class="tag">${r.proteina}</span>
            <span class="tag">${r.carboidrato}</span>
            ${tagsLegumes}
          </div>
          <details>
            <summary>Modo de Preparo</summary>
            <div class="recipe-content">
              ${formatarModoPreparoVertical(r.preparo)}
            </div>
          </details>
          ${prereqsHtml}
        </div>
      `;
    }

    function renderizarCards(lista, container, tipoVazio) {
      container.innerHTML = "";
      if (lista.length === 0) {
        container.innerHTML = `<div class="empty-state">Nenhum ${tipoVazio} encontrado para o filtro selecionado.</div>`;
        return;
      }
      container.innerHTML = lista.map(r => gerarCardHtml(r)).join("");
    }

    function filtrarLista(base) {
      const pSel = document.getElementById("filtroProteina").value;
      const cSel = document.getElementById("filtroCarboidrato").value;
      const lSel = document.getElementById("filtroLegume").value;

      return base.filter(item => {
        const matchProt = !pSel || item.proteina === pSel;
        const matchCarb = !cSel || item.carboidrato === cSel;
        const matchLeg = !lSel || (Array.isArray(item.legumes) && item.legumes.includes(lSel));
        return matchProt && matchCarb && matchLeg;
      });
    }

    function aplicarFiltrosConsulta() {
      renderizarCards(filtrarLista(pratosPrincipais), containerPrincipais, "prato principal");
      renderizarCards(filtrarLista(saladas), containerSaladas, "acompanhamento");
    }

    function limparFiltrosConsulta() {
      document.getElementById("filtroProteina").value = "";
      document.getElementById("filtroCarboidrato").value = "";
      document.getElementById("filtroLegume").value = "";
      aplicarFiltrosConsulta();
    }

    // ==========================================
    // WEEKLY PLANNER ENGINE (Default: 3 Pessoas & Soma de Calorias)
    // ==========================================
    const containerDiasSemana = document.getElementById("containerDiasSemana");

    function montarPlanejadorSemanal() {
      containerDiasSemana.innerHTML = "";

      const optionsPrincipais = pratosPrincipais.map(p => `<option value="${p.id}">${p.nome}</option>`).join("");
      const optionsSaladas = saladas.map(s => `<option value="${s.id}">${s.nome}</option>`).join("");
      const optionsResp = responsaveis.map(resp => `<option value="${resp}">${resp}</option>`).join("");

      diasUteis.forEach(dia => {
        const cardDia = document.createElement("div");
        cardDia.className = "day-planner-card";
        cardDia.innerHTML = `
          <div class="day-header">
            <div class="day-title-text">${dia.nome}</div>
            <div class="day-header-badges">
              <div class="day-cal-total-badge" id="badge_cal_${dia.key}"></div>
              <div class="resp-badge-header" id="badge_resp_${dia.key}"></div>
            </div>
          </div>
          <div class="planner-selectors">
            <div class="form-group">
              <label for="sel_main_${dia.key}">Prato Principal</label>
              <select id="sel_main_${dia.key}" onchange="atualizarResumoDia('${dia.key}')">
                <option value="">Escolher prato...</option>
                ${optionsPrincipais}
              </select>
            </div>
            <div class="form-group">
              <label for="sel_salad_${dia.key}">Salada / Acomp.</label>
              <select id="sel_salad_${dia.key}" onchange="atualizarResumoDia('${dia.key}')">
                <option value="">Sem salada</option>
                ${optionsSaladas}
              </select>
            </div>
            <div class="form-group">
              <label for="sel_resp_${dia.key}">Responsável</label>
              <select id="sel_resp_${dia.key}" onchange="atualizarResumoDia('${dia.key}')">
                <option value="">A definir</option>
                ${optionsResp}
              </select>
            </div>
            <div class="form-group">
              <label for="sel_guests_${dia.key}">Pessoas</label>
              <select id="sel_guests_${dia.key}" onchange="atualizarResumoDia('${dia.key}')">
                <option value="1">1 pessoa</option>
                <option value="2">2 pessoas</option>
                <option value="3" selected>3 pessoas</option>
                <option value="4">4 pessoas</option>
                <option value="5">5 pessoas</option>
                <option value="6">6 pessoas</option>
              </select>
            </div>
          </div>
          <div class="day-summary-container" id="summary_${dia.key}"></div>
        `;
        containerDiasSemana.appendChild(cardDia);
      });
    }

    function atualizarResumoDia(diaKey) {
      const selectMain = document.getElementById(`sel_main_${diaKey}`);
      const selectSalad = document.getElementById(`sel_salad_${diaKey}`);
      const selectResp = document.getElementById(`sel_resp_${diaKey}`);
      const selectGuests = document.getElementById(`sel_guests_${diaKey}`);
      const badgeResp = document.getElementById(`badge_resp_${diaKey}`);
      const badgeCal = document.getElementById(`badge_cal_${diaKey}`);
      const summaryContainer = document.getElementById(`summary_${diaKey}`);

      const pratoId = selectMain ? selectMain.value : "";
      const saladaId = selectSalad ? selectSalad.value : "";
      const respNome = selectResp ? selectResp.value : "";
      const numPessoas = selectGuests ? parseInt(selectGuests.value, 10) : 3;

      if (badgeResp) {
        if (respNome) {
          badgeResp.textContent = `Chef ${respNome}`;
          badgeResp.style.display = "inline-block";
        } else {
          badgeResp.textContent = "";
          badgeResp.style.display = "none";
        }
      }

      let calPrato = 0;
      let calSalada = 0;

      if (!summaryContainer) return;
      summaryContainer.innerHTML = "";

      if (!pratoId && !saladaId) {
        if (badgeCal) badgeCal.style.display = "none";
        return;
      }

      let htmlResult = "";
      const prerequisitosBrutos = new Set();

      // 1. Bloco do Prato Principal
      if (pratoId) {
        const pratoObj = pratosPrincipais.find(p => p.id === pratoId);
        if (pratoObj) {
          calPrato = pratoObj.calorias || 0;
          if (Array.isArray(pratoObj.prerequisitos)) {
            pratoObj.prerequisitos.forEach(req => prerequisitosBrutos.add(req));
          }
          const badgeCalItem = pratoObj.calorias > 0 ? `<span class="cal-badge">${pratoObj.calorias} kcal/porção</span>` : '';
          htmlResult += `
            <div class="day-recipe-block">
              <h4>
                <span><span class="badge-main">Principal</span> ${pratoObj.nome}</span>
                <div style="display:flex; align-items:center; gap:8px;">
                  ${badgeCalItem}
                  <span style="font-size:0.8rem; font-weight:500; color:var(--text-tertiary);">${pratoObj.tempo}</span>
                </div>
              </h4>
              <details style="margin-top: 8px;">
                <summary>Modo de Preparo</summary>
                <div class="recipe-content">
                  ${formatarModoPreparoVertical(pratoObj.preparo)}
                </div>
              </details>
            </div>
          `;
        }
      }

      // 2. Bloco da Salada
      if (saladaId) {
        const saladaObj = saladas.find(s => s.id === saladaId);
        if (saladaObj) {
          calSalada = saladaObj.calorias || 0;
          if (Array.isArray(saladaObj.prerequisitos)) {
            saladaObj.prerequisitos.forEach(req => prerequisitosBrutos.add(req));
          }
          const badgeCalItem = saladaObj.calorias > 0 ? `<span class="cal-badge">${saladaObj.calorias} kcal/porção</span>` : '';
          htmlResult += `
            <div class="day-recipe-block">
              <h4>
                <span><span class="badge-salad">Salada</span> ${saladaObj.nome}</span>
                <div style="display:flex; align-items:center; gap:8px;">
                  ${badgeCalItem}
                  <span style="font-size:0.8rem; font-weight:500; color:var(--text-tertiary);">${saladaObj.tempo}</span>
                </div>
              </h4>
              <details style="margin-top: 8px;">
                <summary>Modo de Preparo</summary>
                <div class="recipe-content">
                  ${formatarModoPreparoVertical(saladaObj.preparo)}
                </div>
              </details>
            </div>
          `;
        }
      }

      // 3. Atualiza Badge com Soma Total de Calorias por Pessoa no Cardápio Diário
      const calTotalDiaPorcao = calPrato + calSalada;
      if (badgeCal) {
        if (calTotalDiaPorcao > 0) {
          badgeCal.textContent = `${calTotalDiaPorcao} kcal / pessoa`;
          badgeCal.style.display = "inline-block";
        } else {
          badgeCal.style.display = "none";
        }
      }

      // 4. Bloco Unificado de Pré-requisitos com Proporção Calculada
      if (prerequisitosBrutos.size > 0) {
        const listaCalculada = Array.from(prerequisitosBrutos).map(req => ajustarTextoRequisito(req, numPessoas));
        const itensHtml = listaCalculada.map(item => `<li>${item}</li>`).join("");
        
        const textoPessoas = numPessoas === 1 ? "1 pessoa" : `${numPessoas} pessoas`;

        htmlResult += `
          <div class="prereqs-box">
            <div class="prereqs-header-row">
              <div class="prereqs-title">Organização Prévia & Requisitos</div>
              <div class="prereqs-portion-pill">Porção para ${textoPessoas}</div>
            </div>
            <ul class="prereqs-list">${itensHtml}</ul>
          </div>
        `;
      }

      summaryContainer.innerHTML = htmlResult;
    }

    // ==========================================
    // PDF / PRINT OUTPUTS (Cálculo via de_base_para_ingredientes.csv)
    // ==========================================
    function executarImpressaoCardapio() {
      document.body.className = "printing-menu";
      document.querySelectorAll("#abaPlanejamento details").forEach(d => d.setAttribute("open", "true"));
      window.print();
    }

    function gerarListaComprasPDF() {
      // Mapeia o total de porções por Base (ex: { "frango": 12, "arroz": 9, "brócolis": 9 })
      const consumoBases = {};
      let totalPratosSelecionados = 0;

      diasUteis.forEach(dia => {
        const selM = document.getElementById(`sel_main_${dia.key}`);
        const selS = document.getElementById(`sel_salad_${dia.key}`);
        const selG = document.getElementById(`sel_guests_${dia.key}`);
        
        const mainVal = selM ? selM.value : "";
        const saladVal = selS ? selS.value : "";
        const pessoas = selG ? parseInt(selG.value, 10) : 3;

        const itensDia = [];
        if (mainVal) {
          const p = pratosPrincipais.find(x => x.id === mainVal);
          if (p) { itensDia.push(p); totalPratosSelecionados++; }
        }
        if (saladVal) {
          const s = saladas.find(x => x.id === saladVal);
          if (s) { itensDia.push(s); totalPratosSelecionados++; }
        }

        itensDia.forEach(item => {
          // Coleta Proteína
          if (item.proteina && item.proteina !== "N/A") {
            const k = item.proteina.trim().toLowerCase();
            consumoBases[k] = (consumoBases[k] || 0) + pessoas;
          }
          // Coleta Carboidrato
          if (item.carboidrato && item.carboidrato !== "N/A") {
            const k = item.carboidrato.trim().toLowerCase();
            consumoBases[k] = (consumoBases[k] || 0) + pessoas;
          }
          // Coleta Legumes
          if (Array.isArray(item.legumes)) {
            item.legumes.forEach(l => {
              if (l) {
                const k = l.trim().toLowerCase();
                consumoBases[k] = (consumoBases[k] || 0) + pessoas;
              }
            });
          }
        });
      });

      if (totalPratosSelecionados === 0) {
        alert("Selecione os pratos da semana antes de gerar a lista de compras.");
        return;
      }

      // Calcula os ingredientes somados a partir de de_base_para_ingredientes.csv
      const agregacaoIngredientes = {}; // { "Peito de Frango": { qtd: 1800, unidade: "g", baseOrigem: "Frango" } }

      Object.keys(consumoBases).forEach(baseKey => {
        const porcoesTotal = consumoBases[baseKey];
        
        // Procura correspondência na tabela de bases
        const mapeados = mapaBaseIngredientes.filter(m => m.base === baseKey);

        if (mapeados.length > 0) {
          mapeados.forEach(regra => {
            const ingKey = regra.ingrediente;
            if (!agregacaoIngredientes[ingKey]) {
              agregacaoIngredientes[ingKey] = {
                qtdTotal: 0,
                unidade: regra.unidade,
                baseOrigem: regra.baseOriginal
              };
            }
            agregacaoIngredientes[ingKey].qtdTotal += (regra.valor * porcoesTotal);
          });
        } else {
          // Fallback caso a base não esteja cadastrada no de_base_para_ingredientes.csv
          const nomeFallback = baseKey.charAt(0).toUpperCase() + baseKey.slice(1);
          if (!agregacaoIngredientes[nomeFallback]) {
            agregacaoIngredientes[nomeFallback] = {
              qtdTotal: porcoesTotal,
              unidade: "porções",
              baseOrigem: nomeFallback
            };
          } else {
            agregacaoIngredientes[nomeFallback].qtdTotal += porcoesTotal;
          }
        }
      });

      function formatarQuantidadeIngrediente(qtd, unidade) {
        if (!unidade) return `${qtd}`;
        // Conversão automática de gramas para kg se for maior ou igual a 1000g
        if (unidade.toLowerCase() === 'g' && qtd >= 1000) {
          const kg = (qtd / 1000).toFixed(2).replace(/\.00$/, '').replace('.', ',');
          return `${kg} kg`;
        }
        // Conversão automática de ml para litros se for maior ou igual a 1000ml
        if (unidade.toLowerCase() === 'ml' && qtd >= 1000) {
          const l = (qtd / 1000).toFixed(2).replace(/\.00$/, '').replace('.', ',');
          return `${l} L`;
        }
        const qtdFormatada = Number.isInteger(qtd) ? qtd : qtd.toFixed(1).replace('.', ',');
        return `${qtdFormatada} ${unidade}`;
      }

      function gerarTabelaIngredientes(agregados) {
        const chaves = Object.keys(agregados).sort();
        if (chaves.length === 0) {
          return `<tr><td colspan="3" style="color:#86868b; font-style:italic;">Nenhum item calculado.</td></tr>`;
        }
        return chaves.map(ingrediente => {
          const item = agregados[ingrediente];
          const qtdExibicao = formatarQuantidadeIngrediente(item.qtdTotal, item.unidade);
          return `
            <tr>
              <td><span class="shopping-check-box"></span> <strong>${ingrediente}</strong></td>
              <td style="color:#6e6e73; font-size:8.5pt;">Base: ${item.baseOrigem}</td>
              <td style="width: 140px; text-align: right; color: var(--text-primary); font-weight: 700;">${qtdExibicao}</td>
            </tr>
          `;
        }).join("");
      }

      const container = document.getElementById("printShoppingContainer");
      container.innerHTML = `
        <div class="shopping-print-title">Lista de Compras Consolidada · Semana</div>
        <p style="font-size: 8.5pt; color: #6e6e73; margin-bottom: 16px;">
          Ingredientes totais calculados a partir da conversão de bases multiplicada pelas porções individuais de cada dia.
        </p>

        <div class="shopping-category-block">
          <div class="shopping-cat-title">Ingredientes Totais para o Mercado</div>
          <table class="shopping-table">
            <thead>
              <tr><th>Ingrediente</th><th>Origem da Base</th><th style="text-align:right;">Quantidade Total</th></tr>
            </thead>
            <tbody>
              ${gerarTabelaIngredientes(agregacaoIngredientes)}
            </tbody>
          </table>
        </div>
      `;

      document.body.className = "printing-shopping";
      window.print();
    }

    // Inicialização
    carregarTodosCSVs();
  </script>
