<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cucina dei Gasparini · Cardápio Semanal</title>
  <!-- SQLite WebAssembly Nativo (sql.js) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
  <style>
    /* ==========================================
       PALETA TRATTORIA MINIMALISTA
       Creme vintage, terracota toscano, marrom café, oliva e detalhes dourados
       ========================================== */
    :root {
      --bg-color: #f7f3e8;
      --card-bg: #ffffff;
      --text-primary: #3b2321;
      --text-secondary: #6e5451;
      --text-tertiary: #967d7a;
      
      --accent-terracota: #b55d3b;
      --accent-terracota-hover: #9e4e30;
      --accent-olive: #5f7450;
      --accent-gold: #c98a3b;
      
      --border-subtle: #e8ded2;
      --border-hover: #d5c5b5;
      --surface-subtle: #fbf9f4;
      --surface-active: #f1ebdE;
      
      --pill-bg: #f2ece1;
      --pill-text: #4a2c2a;
      --chef-bg: #f2ebd9;
      --chef-text: #7c5324;
      
      --prereq-bg: #fdfaf2;
      --prereq-border: #ebd9b5;
      --prereq-text: #6e481f;
      
      --tip-bg: #f4f7f2;
      --tip-border: #cfe0c6;
      --tip-text: #2f5424;
      
      --cal-bg: #fdf3ed;
      --cal-text: #b55d3b;
      --cal-border: #f7cfbe;

      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-full: 9999px;
      --shadow-sm: 0 2px 10px rgba(74, 44, 42, 0.04);
      --shadow-md: 0 6px 24px rgba(74, 44, 42, 0.07);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-color);
      color: var(--text-primary);
      line-height: 1.48;
      letter-spacing: -0.015em;
      padding: 32px 16px 80px;
      max-width: 880px;
      margin: 0 auto;
      -webkit-font-smoothing: antialiased;
    }

    /* Header & Logo (Sem bordas, sem fundo e com +50% de tamanho: 210px) */
    header {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo-container {
      display: inline-block;
      margin-bottom: 16px;
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 0;
      transition: transform 0.25s ease;
    }
    .logo-container:hover {
      transform: scale(1.03);
    }
    .brand-logo {
      width: 210px;
      height: 210px;
      object-fit: contain;
      background: transparent;
      border: none;
      box-shadow: none;
      border-radius: 0;
      padding: 0;
      display: block;
      margin: 0 auto;
    }
    .brand-eyebrow {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent-olive);
      margin-bottom: 4px;
    }
    header h1 {
      font-size: 2.3rem;
      font-weight: 700;
      letter-spacing: -0.035em;
      color: var(--text-primary);
      margin-bottom: 6px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Georgia", serif;
    }
    header p {
      color: var(--text-secondary);
      font-size: 1.02rem;
      font-weight: 400;
      max-width: 520px;
      margin: 0 auto;
    }

    /* Segmented Control (Tabs) */
    .tabs-nav {
      display: flex;
      gap: 5px;
      background: var(--surface-active);
      padding: 5px;
      border-radius: var(--radius-md);
      margin-bottom: 32px;
      max-width: 440px;
      margin-left: auto;
      margin-right: auto;
      border: 1px solid var(--border-subtle);
    }
    .tab-btn {
      flex: 1;
      padding: 10px 18px;
      border: none;
      background: transparent;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      border-radius: 10px;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      text-align: center;
      font-family: inherit;
    }
    .tab-btn.active {
      background: var(--card-bg);
      color: var(--accent-terracota);
      box-shadow: 0 2px 8px rgba(74, 44, 42, 0.08);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Stats bar (Aba Receitas) */
    .consulta-stats-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .stat-card {
      flex: 1;
      min-width: 160px;
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      box-shadow: var(--shadow-sm);
    }
    .stat-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }
    .stat-value {
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--accent-terracota);
      letter-spacing: -0.03em;
    }

    /* Painel de Filtros */
    .filter-panel {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      margin-bottom: 28px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-subtle);
    }
    .filter-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }
    @media (max-width: 680px) {
      .filter-grid { grid-template-columns: 1fr; }
    }

    .form-group label {
      display: block;
      font-weight: 700;
      font-size: 0.76rem;
      letter-spacing: 0.04em;
      margin-bottom: 8px;
      color: var(--text-secondary);
      text-transform: uppercase;
    }

    select {
      width: 100%;
      padding: 11px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background: var(--surface-subtle);
      font-size: 0.92rem;
      outline: none;
      color: var(--text-primary);
      font-family: inherit;
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20width%3D%2220%22%20height%3D%2220%22%20viewBox%3D%220%200%2020%2020%22%20fill%3D%22none%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%3Cpath%20d%3D%22M5%207.5L10%2012.5L15%207.5%22%20stroke%3D%22%23b55d3b%22%20stroke-width%3D%221.8%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E");
      background-repeat: no-repeat;
      background-position: right 12px center;
      background-size: 16px;
      transition: all 0.2s ease;
    }
    select:focus {
      border-color: var(--accent-terracota);
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(181, 93, 59, 0.15);
    }

    .btn-reset {
      width: 100%;
      padding: 10px;
      background: transparent;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .btn-reset:hover {
      background: var(--surface-subtle);
      color: var(--accent-terracota);
      border-color: var(--border-hover);
    }

    /* Section Headings */
    .section-title {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      margin: 28px 0 16px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Georgia", serif;
    }

    .recipes-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 32px;
    }
    .recipe-card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-subtle);
      padding: 22px;
      box-shadow: var(--shadow-sm);
      transition: box-shadow 0.2s ease, transform 0.2s ease;
    }
    .recipe-card:hover {
      box-shadow: var(--shadow-md);
    }
    .recipe-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 12px;
    }
    .recipe-title {
      font-size: 1.18rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }
    .recipe-meta-badges {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .time-badge {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-tertiary);
      white-space: nowrap;
    }
    .cal-badge {
      font-size: 0.76rem;
      font-weight: 700;
      background: var(--cal-bg);
      color: var(--cal-text);
      border: 1px solid var(--cal-border);
      padding: 2px 9px;
      border-radius: var(--radius-full);
      white-space: nowrap;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }
    .tag {
      font-size: 0.78rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      background: var(--pill-bg);
      color: var(--pill-text);
      border: 1px solid var(--border-subtle);
    }

    /* Accordion Details */
    details {
      background: var(--surface-subtle);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      border: 1px solid var(--border-subtle);
      transition: background 0.2s ease;
    }
    summary {
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      color: var(--accent-terracota);
      outline: none;
      user-select: none;
    }
    .recipe-content {
      margin-top: 10px;
      border-top: 1px solid var(--border-subtle);
      padding-top: 10px;
    }
    .preparo-vertical-list {
      list-style-type: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .preparo-vertical-list li {
      font-size: 0.92rem;
      color: var(--text-primary);
      line-height: 1.55;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .preparo-step-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--surface-active);
      color: var(--accent-terracota);
      font-size: 0.75rem;
      font-weight: 700;
      margin-top: 2px;
      flex-shrink: 0;
    }

    /* Dica box */
    .preparo-dica-container {
      margin-top: 6px;
      padding: 10px 14px;
      background: var(--tip-bg);
      border: 1px solid var(--tip-border);
      border-radius: var(--radius-md);
      width: 100%;
    }
    .preparo-dica-title {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--tip-text);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .preparo-dica-content {
      font-size: 0.88rem;
      color: #24461c;
      line-height: 1.5;
    }

    /* Prerequisites Box */
    .prereqs-box {
      margin-top: 14px;
      background: var(--prereq-bg);
      border: 1px solid var(--prereq-border);
      border-radius: var(--radius-md);
      padding: 12px 16px;
    }
    .prereqs-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .prereqs-title {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--prereq-text);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .prereqs-portion-pill {
      font-size: 0.75rem;
      font-weight: 700;
      background: var(--surface-active);
      color: var(--prereq-text);
      padding: 2px 9px;
      border-radius: var(--radius-full);
      border: 1px solid var(--prereq-border);
    }
    .prereqs-list {
      list-style-type: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .prereqs-list li {
      font-size: 0.88rem;
      color: var(--prereq-text);
      display: flex;
      align-items: flex-start;
      gap: 8px;
      line-height: 1.45;
    }
    .prereqs-list li::before {
      content: "—";
      color: var(--accent-terracota);
      font-weight: 700;
    }

    .empty-state {
      padding: 32px;
      text-align: center;
      color: var(--text-tertiary);
      font-size: 0.95rem;
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-subtle);
    }

    /* Weekly Planner Actions & Cards */
    .planner-header-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .action-buttons-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 18px;
      border: none;
      border-radius: var(--radius-full);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      text-decoration: none;
    }
    .btn-print-menu {
      background: var(--accent-terracota);
      color: #ffffff;
    }
    .btn-print-menu:hover {
      background: var(--accent-terracota-hover);
      transform: scale(1.02);
    }
    
    .btn-shopping-list {
      background: var(--surface-active);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
    }
    .btn-shopping-list:hover {
      background: #e6dfd1;
      transform: scale(1.02);
    }

    .day-planner-card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-subtle);
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
    }
    .day-header {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .day-title-text {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Georgia", serif;
    }
    .day-header-badges {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .resp-badge-header {
      font-size: 0.78rem;
      font-weight: 700;
      background: var(--chef-bg);
      color: var(--chef-text);
      padding: 4px 12px;
      border-radius: var(--radius-full);
      display: none;
      letter-spacing: -0.01em;
      border: 1px solid #ebd9b5;
    }
    .day-cal-total-badge {
      font-size: 0.78rem;
      font-weight: 700;
      background: var(--cal-bg);
      color: var(--cal-text);
      border: 1px solid var(--cal-border);
      padding: 4px 12px;
      border-radius: var(--radius-full);
      display: none;
      letter-spacing: -0.01em;
    }
    
    .planner-selectors {
      display: grid;
      grid-template-columns: 1.3fr 1.3fr 1fr 0.9fr;
      gap: 14px;
      margin-bottom: 18px;
    }
    @media (max-width: 760px) {
      .planner-selectors { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 480px) {
      .planner-selectors { grid-template-columns: 1fr; }
    }

    .day-summary-container { margin-top: 14px; }
    .day-recipe-block {
      background: var(--surface-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-top: 12px;
    }
    .day-recipe-block h4 {
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .badge-salad {
      font-size: 0.72rem;
      font-weight: 700;
      background: #eef4ec;
      color: var(--accent-olive);
      padding: 3px 8px;
      border-radius: var(--radius-sm);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .badge-main {
      font-size: 0.72rem;
      font-weight: 700;
      background: var(--cal-bg);
      color: var(--accent-terracota);
      padding: 3px 8px;
      border-radius: var(--radius-sm);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    #printShoppingContainer { display: none; }

    /* Print Setup */
    @media print {
      @page {
        size: A4 portrait;
        margin: 14mm 12mm;
      }
      body {
        background: #ffffff !important;
        color: #000000 !important;
        padding: 0 !important;
        max-width: 100% !important;
        font-size: 9.5pt;
      }
      header, .tabs-nav, #abaConsulta, .planner-selectors, .planner-header-actions, select {
        display: none !important;
      }

      body.printing-menu #abaPlanejamento { display: block !important; }
      body.printing-menu #printShoppingContainer { display: none !important; }
      body.printing-menu .day-planner-card {
        page-break-inside: avoid;
        border: 1px solid #d1d1d6 !important;
        box-shadow: none !important;
        margin-bottom: 14px !important;
        padding: 14px !important;
        background: #ffffff !important;
        border-radius: 10px !important;
      }
      body.printing-menu .day-header {
        font-size: 12pt !important;
        border-bottom: 1.5px solid #3b2321 !important;
        margin-bottom: 10px !important;
        padding-bottom: 4px !important;
      }
      body.printing-menu .resp-badge-header {
        display: inline-block !important;
        border: 1px solid #c98a3b !important;
        color: #7c5324 !important;
        font-size: 8pt !important;
        padding: 2px 8px !important;
      }
      body.printing-menu .day-cal-total-badge {
        display: inline-block !important;
        border: 1px solid #b55d3b !important;
        color: #b55d3b !important;
        font-size: 8pt !important;
        padding: 2px 8px !important;
      }
      body.printing-menu .day-recipe-block {
        border: 1px solid #e5e5ea !important;
        background: #fafafa !important;
        padding: 10px !important;
        margin-top: 8px !important;
        border-radius: 8px !important;
      }
      body.printing-menu details {
        background: transparent !important;
        padding: 0 !important;
        border: none !important;
      }
      body.printing-menu details summary { display: none !important; }
      body.printing-menu details .recipe-content {
        display: block !important;
        border-top: none !important;
        padding-top: 4px !important;
      }
      body.printing-menu .preparo-vertical-list li {
        font-size: 9pt !important;
        color: #1d1d1f !important;
      }
      body.printing-menu .preparo-step-number {
        background: #e5e5ea !important;
        color: #000000 !important;
      }
      body.printing-menu .preparo-dica-container {
        background: #f4f7f2 !important;
        border: 1px solid #cfe0c6 !important;
        padding: 6px 10px !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      body.printing-menu .prereqs-box {
        background: #fdfaf2 !important;
        border: 1px solid #ebd9b5 !important;
        padding: 8px 10px !important;
        margin-top: 8px !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      body.printing-menu .prereqs-title { font-size: 8pt !important; }
      body.printing-menu .prereqs-portion-pill {
        border: 1px solid #c98a3b !important;
        font-size: 7.5pt !important;
        padding: 1px 6px !important;
      }
      body.printing-menu .prereqs-list li {
        font-size: 8.5pt !important;
        color: #6e481f !important;
      }

      body.printing-shopping #abaPlanejamento { display: none !important; }
      body.printing-shopping #printShoppingContainer { display: block !important; }
      .shopping-print-title {
        font-size: 16pt !important;
        font-weight: 700 !important;
        color: #3b2321 !important;
        border-bottom: 2px solid #3b2321 !important;
        padding-bottom: 6px !important;
        margin-bottom: 12px !important;
        letter-spacing: -0.02em;
      }
      .shopping-category-block {
        margin-bottom: 18px !important;
        page-break-inside: avoid;
      }
      .shopping-cat-title {
        font-size: 11pt !important;
        font-weight: 600 !important;
        padding: 4px 0 !important;
        margin-bottom: 8px !important;
        border-bottom: 1px solid #d5c5b5;
        color: #3b2321 !important;
      }
      .shopping-table {
        width: 100% !important;
        border-collapse: collapse !important;
        margin-bottom: 8px !important;
      }
      .shopping-table th, .shopping-table td {
        border-bottom: 1px solid #e8ded2 !important;
        padding: 7px 8px !important;
        font-size: 9pt !important;
      }
      .shopping-table th {
        color: #6e5451 !important;
        font-weight: 600 !important;
        text-align: left !important;
        text-transform: uppercase;
        font-size: 7.5pt !important;
        letter-spacing: 0.05em;
      }
      .shopping-check-box {
        width: 13px;
        height: 13px;
        border: 1px solid #967d7a;
        border-radius: 3px;
        display: inline-block;
        margin-right: 8px;
        vertical-align: middle;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <img src="logo.png" alt="Logo Cucina dei Gasparini" class="brand-logo" onerror="this.onerror=null; this.src='logo_transparente.png';">
    </div>
    <div class="brand-eyebrow">Trattoria Velocissima</div>
    <h1>Cucina dei Gasparini</h1>
    <p>una soluzione artificiale a un problema naturale.</p>
  </header>

  <!-- Segmented Control Tabs -->
  <nav class="tabs-nav">
    <button id="btnTabSemana" class="tab-btn active" onclick="trocarAba('abaPlanejamento')">Semana</button>
    <button id="btnTabReceitas" class="tab-btn" onclick="trocarAba('abaReceitas')">Receitas</button>
  </nav>

  <!-- ==========================================
       TAB 1: SEMANA (Weekly Planner)
       ========================================== -->
  <section id="abaPlanejamento" class="tab-content active">
    <div class="planner-header-actions">
      <div>
        <h2 style="font-size: 1.35rem; font-weight: 700; color: var(--text-primary); font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Georgia', serif;">Jantares da Semana</h2>
        <p style="color: var(--text-secondary); font-size: 0.9rem;">Selecione prato, salada, chef e número de pessoas (1 a 6).</p>
      </div>
      <div class="action-buttons-group">
        <a href="admin.html" class="btn-action" style="background:var(--card-bg); color:var(--text-primary); border:1px solid var(--border-subtle);" target="_blank">
          ⚙ Gerenciar Banco
        </a>
        <button class="btn-action btn-shopping-list" onclick="gerarListaComprasPDF()">
          Lista de Compras
        </button>
        <button class="btn-action btn-print-menu" onclick="executarImpressaoCardapio()">
          Imprimir Cardápio
        </button>
      </div>
    </div>

    <div id="containerDiasSemana"></div>
  </section>

  <!-- ==========================================
       TAB 2: RECEITAS (Consulta & Filtros)
       ========================================== -->
  <section id="abaReceitas" class="tab-content">
    <div class="consulta-stats-bar">
      <div class="stat-card">
        <div class="stat-label">Pratos Principais</div>
        <div class="stat-value" id="statPratosCount">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Saladas & Acomp.</div>
        <div class="stat-value" id="statSaladasCount">0</div>
      </div>
    </div>

    <div class="filter-panel">
      <div class="filter-grid">
        <div class="form-group">
          <label for="filtroProteina">Proteína</label>
          <select id="filtroProteina" onchange="aplicarFiltrosConsulta()">
            <option value="">Todas as opções</option>
          </select>
        </div>

        <div class="form-group">
          <label for="filtroCarboidrato">Carboidrato</label>
          <select id="filtroCarboidrato" onchange="aplicarFiltrosConsulta()">
            <option value="">Todas as opções</option>
          </select>
        </div>

        <div class="form-group">
          <label for="filtroLegume">Legume / Vegetal</label>
          <select id="filtroLegume" onchange="aplicarFiltrosConsulta()">
            <option value="">Todos os legumes</option>
          </select>
        </div>
      </div>
      <button class="btn-reset" onclick="limparFiltrosConsulta()">Limpar Filtros de Consulta</button>
    </div>

    <h2 class="section-title">Pratos Principais</h2>
    <main class="recipes-list" id="listaPrincipais"></main>

    <h2 class="section-title">Saladas & Acompanhamentos</h2>
    <main class="recipes-list" id="listaSaladas"></main>
  </section>

  <div id="printShoppingContainer"></div>

  <script>
    // ==========================================
    // DADOS E ESTADO
    // ==========================================
    const responsaveis = ["Ulises", "Paula", "Maitê"];
    const diasUteis = [
      { key: "seg", nome: "Segunda-feira" },
      { key: "ter", nome: "Terça-feira" },
      { key: "qua", nome: "Quarta-feira" },
      { key: "qui", nome: "Quinta-feira" },
      { key: "sex", nome: "Sexta-feira" }
    ];

    let dbInstance = null;
    let pratosPrincipais = [];
    let saladas = [];
    let mapaBaseIngredientes = [];

    // ==========================================
    // HELPERS
    // ==========================================
    function formatarModoPreparoVertical(textoPreparo) {
      if (!textoPreparo) return "<p style='color:var(--text-tertiary); font-size:0.9rem;'>Sem modo de preparo cadastrado.</p>";
      
      let partes = textoPreparo
        .split(/(?:\r?\n|\.(?!\d)|;)+/)
        .map(p => p.trim())
        .filter(p => p.length > 0);

      let stepCounter = 1;
      let itensHtml = "";

      partes.forEach(parte => {
        const matchDica = parte.match(/^dica[:\s\-—]*(.*)$/i);
        if (matchDica) {
          const conteudoDica = matchDica[1].trim();
          itensHtml += `
            <li style="display:block; width:100%;">
              <div class="preparo-dica-container">
                <div class="preparo-dica-title">Dica do Chef</div>
                <div class="preparo-dica-content">${conteudoDica ? (conteudoDica + (conteudoDica.endsWith('.') ? '' : '.')) : ''}</div>
              </div>
            </li>
          `;
        } else {
          itensHtml += `
            <li>
              <span class="preparo-step-number">${stepCounter++}</span>
              <div>${parte}${parte.endsWith('.') ? '' : '.'}</div>
            </li>
          `;
        }
      });

      return `<ul class="preparo-vertical-list">${itensHtml}</ul>`;
    }

    function ajustarTextoRequisito(texto, pessoas) {
      if (!pessoas || pessoas === 1) return texto;

      return texto.replace(/(\b\d+(?:[.,]\d+)?\s*)(g|kg|ml|l|xícara|xícaras|colher|colheres|dente|dentes|unidade|unidades|fatia|fatias|filé|filés|posta|postas|folha|folhas)?\b/gi, (match, numStr, unit) => {
        const numOriginal = parseFloat(numStr.replace(',', '.'));
        if (isNaN(numOriginal)) return match;
        
        const numCalculado = numOriginal * pessoas;
        const numFormatado = Number.isInteger(numCalculado) ? numCalculado : numCalculado.toFixed(1).replace('.', ',');
        return `${numFormatado}${unit ? ' ' + unit : ''}`;
      });
    }

    // ==========================================
    // CARREGAMENTO DIRETO DO cardapio.db VIA FETCH
    // ==========================================
    async function carregarCardapioDB() {
      try {
        const initSqlJs = window.initSqlJs;
        if (!initSqlJs) throw new Error("sql.js indisponível");

        const SQL = await initSqlJs({
          locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`
        });

        // 1. Busca o arquivo binário cardapio.db na mesma pasta raiz
        const response = await fetch("cardapio.db", { cache: "no-cache" });
        if (!response.ok) {
          throw new Error(`Não foi possível carregar 'cardapio.db' (Status ${response.status}). Certifique-se de que o arquivo está na mesma pasta.`);
        }

        const buffer = await response.arrayBuffer();
        const db = new SQL.Database(new Uint8Array(buffer));
        dbInstance = db;

        // 2. Lê os Pratos diretamente do SQLite
        const resPratos = db.exec("SELECT id, nome_do_prato, tempo_de_preparo, receita, legumes, proteinas, carboidratos, requisitos, calorias FROM pratos ORDER BY nome_do_prato ASC");
        if (resPratos.length > 0) {
          const cols = resPratos[0].columns;
          pratosPrincipais = resPratos[0].values.map(row => {
            const obj = {};
            cols.forEach((col, idx) => obj[col] = row[idx]);
            return {
              id: `prato_${obj.id}`,
              nome: obj.nome_do_prato,
              tempo: obj.tempo_de_preparo || "20 min",
              preparo: obj.receita || "",
              proteina: obj.proteinas || "N/A",
              carboidrato: obj.carboidratos || "N/A",
              legumes: obj.legumes ? obj.legumes.split(/[,;]/).map(l => l.trim()) : [],
              prerequisitos: obj.requisitos ? obj.requisitos.split(/[;\n]/).map(r => r.trim()) : [],
              calorias: obj.calorias || 0
            };
          });
        }

        // 3. Lê as Saladas diretamente do SQLite
        const resSaladas = db.exec("SELECT id, nome_da_salada, tempo, modo_de_preparo, legumes, proteinas, carboidratos, requisitos, calorias FROM saladas ORDER BY nome_da_salada ASC");
        if (resSaladas.length > 0) {
          const cols = resSaladas[0].columns;
          saladas = resSaladas[0].values.map(row => {
            const obj = {};
            cols.forEach((col, idx) => obj[col] = row[idx]);
            return {
              id: `salada_${obj.id}`,
              nome: obj.nome_da_salada,
              tempo: obj.tempo || "15 min",
              preparo: obj.modo_de_preparo || "",
              proteina: obj.proteinas || "N/A",
              carboidrato: obj.carboidratos || "N/A",
              legumes: obj.legumes ? obj.legumes.split(/[,;]/).map(l => l.trim()) : [],
              prerequisitos: obj.requisitos ? obj.requisitos.split(/[;\n]/).map(r => r.trim()) : [],
              calorias: obj.calorias || 0
            };
          });
        }

        // 4. Lê as Regras de de_base_para_ingredientes diretamente do SQLite
        const resBase = db.exec("SELECT bases, ingredientes, unidades FROM de_base_para_ingredientes");
        if (resBase.length > 0) {
          const cols = resBase[0].columns;
          mapaBaseIngredientes = resBase[0].values.map(row => {
            const obj = {};
            cols.forEach((col, idx) => obj[col] = row[idx]);
            const base = (obj.bases || "").trim();
            const ingrediente = (obj.ingredientes || "").trim();
            const unidadesStr = (obj.unidades || "1 un").trim();

            const match = unidadesStr.match(/^([\d.,]+)\s*(.*)$/);
            let valor = 1;
            let unidade = unidadesStr;

            if (match) {
              valor = parseFloat(match[1].replace(',', '.')) || 1;
              unidade = match[2].trim() || "";
            }

            return {
              base: base.toLowerCase(),
              baseOriginal: base,
              ingrediente: ingrediente,
              valor: valor,
              unidade: unidade
            };
          });
        }

        atualizarInterface();
      } catch (err) {
        console.error(err);
        document.getElementById("listaPrincipais").innerHTML = `
          <div class="empty-state" style="border-color:#fca5a5; color:#991b1b; background:#fef2f2;">
            <strong>Aviso:</strong> Não foi possível carregar o arquivo <code>cardapio.db</code>.<br>
            Certifique-se de que o arquivo <code>cardapio.db</code> está salvo exatamente na mesma pasta do <code>index.html</code>.
          </div>
        `;
      }
    }

    function popularSelectsFiltro() {
      const todos = [...pratosPrincipais, ...saladas];
      const selP = document.getElementById("filtroProteina");
      const selC = document.getElementById("filtroCarboidrato");
      const selL = document.getElementById("filtroLegume");

      selP.innerHTML = '<option value="">Todas as proteínas</option>';
      selC.innerHTML = '<option value="">Todos os carboidratos</option>';
      selL.innerHTML = '<option value="">Todos os legumes</option>';

      const proteinas = [...new Set(todos.map(r => r.proteina).filter(p => p && p !== "N/A"))].sort();
      const carboidratos = [...new Set(todos.map(r => r.carboidrato).filter(c => c && c !== "N/A"))].sort();
      
      const legumesSet = new Set();
      todos.forEach(r => {
        if (Array.isArray(r.legumes)) {
          r.legumes.forEach(l => { if (l) legumesSet.add(l); });
        }
      });
      const legumes = [...legumesSet].sort();

      proteinas.forEach(p => selP.innerHTML += `<option value="${p}">${p}</option>`);
      carboidratos.forEach(c => selC.innerHTML += `<option value="${c}">${c}</option>`);
      legumes.forEach(l => selL.innerHTML += `<option value="${l}">${l}</option>`);
    }

    function atualizarInterface() {
      document.getElementById("statPratosCount").textContent = pratosPrincipais.length;
      document.getElementById("statSaladasCount").textContent = saladas.length;

      popularSelectsFiltro();
      aplicarFiltrosConsulta();
      montarPlanejadorSemanal();
    }

    function trocarAba(abaId) {
      document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
      document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));
      
      const targetSection = document.getElementById(abaId);
      if (targetSection) targetSection.classList.add("active");
      
      if (abaId === 'abaPlanejamento') {
        document.getElementById('btnTabSemana').classList.add("active");
      } else {
        document.getElementById('btnTabReceitas').classList.add("active");
      }
    }

    const containerPrincipais = document.getElementById("listaPrincipais");
    const containerSaladas = document.getElementById("listaSaladas");

    function gerarCardHtml(r) {
      const tagsLegumes = (r.legumes || []).map(leg => `<span class="tag">${leg}</span>`).join(" ");
      const badgeCaloria = r.calorias > 0 ? `<span class="cal-badge">${r.calorias} kcal</span>` : '';

      let prereqsHtml = "";
      if (r.prerequisitos && r.prerequisitos.length > 0) {
        const itens = r.prerequisitos.map(item => `<li>${item}</li>`).join("");
        prereqsHtml = `
          <div class="prereqs-box">
            <div class="prereqs-title">Organização Prévia & Requisitos (Base: 1 porção)</div>
            <ul class="prereqs-list">${itens}</ul>
          </div>
        `;
      }

      return `
        <div class="recipe-card">
          <div class="recipe-header">
            <span class="recipe-title">${r.nome}</span>
            <div class="recipe-meta-badges">
              ${badgeCaloria}
              <span class="time-badge">${r.tempo}</span>
            </div>
          </div>
          <div class="tags">
            <span class="tag">${r.proteina}</span>
            <span class="tag">${r.carboidrato}</span>
            ${tagsLegumes}
          </div>
          <details>
            <summary>Modo de Preparo</summary>
            <div class="recipe-content">
              ${formatarModoPreparoVertical(r.preparo)}
            </div>
          </details>
          ${prereqsHtml}
        </div>
      `;
    }

    function renderizarCards(lista, container, tipoVazio) {
      container.innerHTML = "";
      if (lista.length === 0) {
        container.innerHTML = `<div class="empty-state">Nenhum ${tipoVazio} encontrado para o filtro selecionado.</div>`;
        return;
      }
      container.innerHTML = lista.map(r => gerarCardHtml(r)).join("");
    }

    function filtrarLista(base) {
      const pSel = document.getElementById("filtroProteina").value;
      const cSel = document.getElementById("filtroCarboidrato").value;
      const lSel = document.getElementById("filtroLegume").value;

      return base.filter(item => {
        const matchProt = !pSel || item.proteina === pSel;
        const matchCarb = !cSel || item.carboidrato === cSel;
        const matchLeg = !lSel || (Array.isArray(item.legumes) && item.legumes.includes(lSel));
        return matchProt && matchCarb && matchLeg;
      });
    }

    function aplicarFiltrosConsulta() {
      renderizarCards(filtrarLista(pratosPrincipais), containerPrincipais, "prato principal");
      renderizarCards(filtrarLista(saladas), containerSaladas, "acompanhamento");
    }

    function limparFiltrosConsulta() {
      document.getElementById("filtroProteina").value = "";
      document.getElementById("filtroCarboidrato").value = "";
      document.getElementById("filtroLegume").value = "";
      aplicarFiltrosConsulta();
    }

    // ==========================================
    // WEEKLY PLANNER ENGINE
    // ==========================================
    const containerDiasSemana = document.getElementById("containerDiasSemana");

    function montarPlanejadorSemanal() {
      containerDiasSemana.innerHTML = "";

      const optionsPrincipais = pratosPrincipais.map(p => `<option value="${p.id}">${p.nome}</option>`).join("");
      const optionsSaladas = saladas.map(s => `<option value="${s.id}">${s.nome}</option>`).join("");
      const optionsResp = responsaveis.map(resp => `<option value="${resp}">${resp}</option>`).join("");

      diasUteis.forEach(dia => {
        const cardDia = document.createElement("div");
        cardDia.className = "day-planner-card";
        cardDia.innerHTML = `
          <div class="day-header">
            <div class="day-title-text">${dia.nome}</div>
            <div class="day-header-badges">
              <div class="day-cal-total-badge" id="badge_cal_${dia.key}"></div>
              <div class="resp-badge-header" id="badge_resp_${dia.key}"></div>
            </div>
          </div>
          <div class="planner-selectors">
            <div class="form-group">
              <label for="sel_main_${dia.key}">Prato Principal</label>
              <select id="sel_main_${dia.key}" onchange="atualizarResumoDia('${dia.key}')">
                <option value="">Escolher prato...</option>
                ${optionsPrincipais}
              </select>
            </div>
            <div class="form-group">
              <label for="sel_salad_${dia.key}">Salada / Acomp.</label>
              <select id="sel_salad_${dia.key}" onchange="atualizarResumoDia('${dia.key}')">
                <option value="">Sem salada</option>
                ${optionsSaladas}
              </select>
            </div>
            <div class="form-group">
              <label for="sel_resp_${dia.key}">Chef Responsável</label>
              <select id="sel_resp_${dia.key}" onchange="atualizarResumoDia('${dia.key}')">
                <option value="">A definir</option>
                ${optionsResp}
              </select>
            </div>
            <div class="form-group">
              <label for="sel_guests_${dia.key}">Comensais</label>
              <select id="sel_guests_${dia.key}" onchange="atualizarResumoDia('${dia.key}')">
                <option value="1">1 pessoa</option>
                <option value="2">2 pessoas</option>
                <option value="3" selected>3 pessoas</option>
                <option value="4">4 pessoas</option>
                <option value="5">5 pessoas</option>
                <option value="6">6 pessoas</option>
              </select>
            </div>
          </div>
          <div class="day-summary-container" id="summary_${dia.key}"></div>
        `;
        containerDiasSemana.appendChild(cardDia);
      });
    }

    function atualizarResumoDia(diaKey) {
      const selectMain = document.getElementById(`sel_main_${diaKey}`);
      const selectSalad = document.getElementById(`sel_salad_${diaKey}`);
      const selectResp = document.getElementById(`sel_resp_${diaKey}`);
      const selectGuests = document.getElementById(`sel_guests_${diaKey}`);
      const badgeResp = document.getElementById(`badge_resp_${diaKey}`);
      const badgeCal = document.getElementById(`badge_cal_${diaKey}`);
      const summaryContainer = document.getElementById(`summary_${diaKey}`);

      const pratoId = selectMain ? selectMain.value : "";
      const saladaId = selectSalad ? selectSalad.value : "";
      const respNome = selectResp ? selectResp.value : "";
      const numPessoas = selectGuests ? parseInt(selectGuests.value, 10) : 3;

      if (badgeResp) {
        if (respNome) {
          badgeResp.textContent = `Chef ${respNome}`;
          badgeResp.style.display = "inline-block";
        } else {
          badgeResp.textContent = "";
          badgeResp.style.display = "none";
        }
      }

      let calPrato = 0;
      let calSalada = 0;

      if (!summaryContainer) return;
      summaryContainer.innerHTML = "";

      if (!pratoId && !saladaId) {
        if (badgeCal) badgeCal.style.display = "none";
        return;
      }

      let htmlResult = "";
      const prerequisitosBrutos = new Set();

      if (pratoId) {
        const pratoObj = pratosPrincipais.find(p => p.id === pratoId);
        if (pratoObj) {
          calPrato = pratoObj.calorias || 0;
          if (Array.isArray(pratoObj.prerequisitos)) {
            pratoObj.prerequisitos.forEach(req => prerequisitosBrutos.add(req));
          }
          const badgeCalItem = pratoObj.calorias > 0 ? `<span class="cal-badge">${pratoObj.calorias} kcal/porção</span>` : '';
          htmlResult += `
            <div class="day-recipe-block">
              <h4>
                <span><span class="badge-main">Principal</span> ${pratoObj.nome}</span>
                <div style="display:flex; align-items:center; gap:8px;">
                  ${badgeCalItem}
                  <span style="font-size:0.8rem; font-weight:600; color:var(--text-tertiary);">${pratoObj.tempo}</span>
                </div>
              </h4>
              <details style="margin-top: 8px;">
                <summary>Modo de Preparo</summary>
                <div class="recipe-content">
                  ${formatarModoPreparoVertical(pratoObj.preparo)}
                </div>
              </details>
            </div>
          `;
        }
      }

      if (saladaId) {
        const saladaObj = saladas.find(s => s.id === saladaId);
        if (saladaObj) {
          calSalada = saladaObj.calorias || 0;
          if (Array.isArray(saladaObj.prerequisitos)) {
            saladaObj.prerequisitos.forEach(req => prerequisitosBrutos.add(req));
          }
          const badgeCalItem = saladaObj.calorias > 0 ? `<span class="cal-badge">${saladaObj.calorias} kcal/porção</span>` : '';
          htmlResult += `
            <div class="day-recipe-block">
              <h4>
                <span><span class="badge-salad">Salada</span> ${saladaObj.nome}</span>
                <div style="display:flex; align-items:center; gap:8px;">
                  ${badgeCalItem}
                  <span style="font-size:0.8rem; font-weight:600; color:var(--text-tertiary);">${saladaObj.tempo}</span>
                </div>
              </h4>
              <details style="margin-top: 8px;">
                <summary>Modo de Preparo</summary>
                <div class="recipe-content">
                  ${formatarModoPreparoVertical(saladaObj.preparo)}
                </div>
              </details>
            </div>
          `;
        }
      }

      const calTotalDiaPorcao = calPrato + calSalada;
      if (badgeCal) {
        if (calTotalDiaPorcao > 0) {
          badgeCal.textContent = `${calTotalDiaPorcao} kcal / pessoa`;
          badgeCal.style.display = "inline-block";
        } else {
          badgeCal.style.display = "none";
        }
      }

      if (prerequisitosBrutos.size > 0) {
        const listaCalculada = Array.from(prerequisitosBrutos).map(req => ajustarTextoRequisito(req, numPessoas));
        const itensHtml = listaCalculada.map(item => `<li>${item}</li>`).join("");
        const textoPessoas = numPessoas === 1 ? "1 pessoa" : `${numPessoas} pessoas`;

        htmlResult += `
          <div class="prereqs-box">
            <div class="prereqs-header-row">
              <div class="prereqs-title">Organização Prévia & Requisitos</div>
              <div class="prereqs-portion-pill">Porção para ${textoPessoas}</div>
            </div>
            <ul class="prereqs-list">${itensHtml}</ul>
          </div>
        `;
      }

      summaryContainer.innerHTML = htmlResult;
    }

    // ==========================================
    // PDF / PRINT OUTPUTS
    // ==========================================
    function executarImpressaoCardapio() {
      document.body.className = "printing-menu";
      document.querySelectorAll("#abaPlanejamento details").forEach(d => d.setAttribute("open", "true"));
      window.print();
    }

    function gerarListaComprasPDF() {
      const consumoBases = {};
      let totalPratosSelecionados = 0;

      diasUteis.forEach(dia => {
        const selM = document.getElementById(`sel_main_${dia.key}`);
        const selS = document.getElementById(`sel_salad_${dia.key}`);
        const selG = document.getElementById(`sel_guests_${dia.key}`);
        
        const mainVal = selM ? selM.value : "";
        const saladVal = selS ? selS.value : "";
        const pessoas = selG ? parseInt(selG.value, 10) : 3;

        const itensDia = [];
        if (mainVal) {
          const p = pratosPrincipais.find(x => x.id === mainVal);
          if (p) { itensDia.push(p); totalPratosSelecionados++; }
        }
        if (saladVal) {
          const s = saladas.find(x => x.id === saladVal);
          if (s) { itensDia.push(s); totalPratosSelecionados++; }
        }

        itensDia.forEach(item => {
          if (item.proteina && item.proteina !== "N/A") {
            const k = item.proteina.trim().toLowerCase();
            consumoBases[k] = (consumoBases[k] || 0) + pessoas;
          }
          if (item.carboidrato && item.carboidrato !== "N/A") {
            const k = item.carboidrato.trim().toLowerCase();
            consumoBases[k] = (consumoBases[k] || 0) + pessoas;
          }
          if (Array.isArray(item.legumes)) {
            item.legumes.forEach(l => {
              if (l) {
                const k = l.trim().toLowerCase();
                consumoBases[k] = (consumoBases[k] || 0) + pessoas;
              }
            });
          }
        });
      });

      if (totalPratosSelecionados === 0) {
        alert("Selecione os pratos da semana antes de gerar a lista de compras.");
        return;
      }

      const agregacaoIngredientes = {};

      Object.keys(consumoBases).forEach(baseKey => {
        const porcoesTotal = consumoBases[baseKey];
        const mapeados = mapaBaseIngredientes.filter(m => m.base === baseKey);

        if (mapeados.length > 0) {
          mapeados.forEach(regra => {
            const ingKey = regra.ingrediente;
            if (!agregacaoIngredientes[ingKey]) {
              agregacaoIngredientes[ingKey] = {
                qtdTotal: 0,
                unidade: regra.unidade,
                baseOrigem: regra.baseOriginal
              };
            }
            agregacaoIngredientes[ingKey].qtdTotal += (regra.valor * porcoesTotal);
          });
        } else {
          const nomeFallback = baseKey.charAt(0).toUpperCase() + baseKey.slice(1);
          if (!agregacaoIngredientes[nomeFallback]) {
            agregacaoIngredientes[nomeFallback] = {
              qtdTotal: porcoesTotal,
              unidade: "porções",
              baseOrigem: nomeFallback
            };
          } else {
            agregacaoIngredientes[nomeFallback].qtdTotal += porcoesTotal;
          }
        }
      });

      function formatarQuantidadeIngrediente(qtd, unidade) {
        if (!unidade) return `${qtd}`;
        if (unidade.toLowerCase() === 'g' && qtd >= 1000) {
          const kg = (qtd / 1000).toFixed(2).replace(/\.00$/, '').replace('.', ',');
          return `${kg} kg`;
        }
        if (unidade.toLowerCase() === 'ml' && qtd >= 1000) {
          const l = (qtd / 1000).toFixed(2).replace(/\.00$/, '').replace('.', ',');
          return `${l} L`;
        }
        const qtdFormatada = Number.isInteger(qtd) ? qtd : qtd.toFixed(1).replace('.', ',');
        return `${qtdFormatada} ${unidade}`;
      }

      function gerarTabelaIngredientes(agregados) {
        const chaves = Object.keys(agregados).sort();
        if (chaves.length === 0) {
          return `<tr><td colspan="3" style="color:#967d7a; font-style:italic;">Nenhum item calculado.</td></tr>`;
        }
        return chaves.map(ingrediente => {
          const item = agregados[ingrediente];
          const qtdExibicao = formatarQuantidadeIngrediente(item.qtdTotal, item.unidade);
          return `
            <tr>
              <td><span class="shopping-check-box"></span> <strong>${ingrediente}</strong></td>
              <td style="color:#6e5451; font-size:8.5pt;">Base: ${item.baseOrigem}</td>
              <td style="width: 140px; text-align: right; color: var(--text-primary); font-weight: 700;">${qtdExibicao}</td>
            </tr>
          `;
        }).join("");
      }

      const container = document.getElementById("printShoppingContainer");
      container.innerHTML = `
        <div class="shopping-print-title">Cucina dei Gasparini · Lista de Compras da Semana</div>
        <p style="font-size: 8.5pt; color: #6e5451; margin-bottom: 16px;">
          Ingredientes consolidados calculados pela conversão de bases multiplicada pelo número de comensais de cada jantar.
        </p>

        <div class="shopping-category-block">
          <div class="shopping-cat-title">Ingredientes para o Mercado</div>
          <table class="shopping-table">
            <thead>
              <tr><th>Ingrediente</th><th>Origem da Base</th><th style="text-align:right;">Quantidade Total</th></tr>
            </thead>
            <tbody>
              ${gerarTabelaIngredientes(agregacaoIngredientes)}
            </tbody>
          </table>
        </div>
      `;

      document.body.className = "printing-shopping";
      window.print();
    }

    // Inicialização direta do cardapio.db
    carregarCardapioDB();
  </script>
</body>
